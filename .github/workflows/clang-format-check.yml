name: C and C++ formatting
on:
  push:
    paths: ['src/**', '.clang-format', '.github/workflows/clang-format-check.yml']
  pull_request:
    paths: ['src/**', '.clang-format', '.github/workflows/clang-format-check.yml']
  workflow_dispatch:
jobs:
  formatting-check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: jidicula/clang-format-action@v4.10.2
        with:
          clang-format-version: '18'
          check-path: 'src'
          include-regex: '^.*\.(c|cpp|h)$'
          exclude-regex: '(^|/)(build|managed_components|cmake-build-[^/]*|motor_assets|m5stack_tab5|esp_lcd_st7121|pi4ioe5v6408)(/|$)'
