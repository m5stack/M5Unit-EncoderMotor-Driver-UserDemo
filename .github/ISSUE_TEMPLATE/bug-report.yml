name: EncoderMotor demo bug report
description: Report a reproducible issue in this ESP-IDF demo.
labels: ["type: bug"]
body:
  - type: textarea
    id: hardware
    attributes:
      label: Hardware and configuration
      value: |
        - Tab5 chip revision:
        - Motor module (U232/U233) and firmware:
        - I2C address and wiring:
        - ESP-IDF version:
        - SDKCONFIG profile:
        - Repository revision:
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the selected channel, mode and target values.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant serial logs and screenshots
    validations:
      required: false
